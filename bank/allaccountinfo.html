<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    
    <title>Document</title>
    <style>
        body {
            text-align: center;
            align-items: center;
        }
        table {
            border-collapse: collapse; /* 테두리를 한 줄로 합침 */
            margin: 0 auto;            /* 테이블을 화면 가운데로 정렬 */
            text-align: center;
            width: 700px;
            height: 400px;
        }

        tr, td, th {
            border: 1px solid black;
        }

        #first {
            background-color: lightgray;
            font-weight: bold;
        }

       
    </style>

    <script>
        let accs = [
            {id:'1001', name:'홍길동', balancd:100000, account:"일반", grade: ""},
            {id:'1002', name:'고길동', balancd:200000, account:"특수",grade: "VIP"},
            {id:'1003', name:'송길동', balancd:300000, account:"특수",grade: "Gold"},
            {id:'1004', name:'하길동', balancd:400000, account:"특수",grade: "Silver"},
            {id:'1005', name:'장길동', balancd:500000, account:"특수",grade: "Bronze"},
            {id:'1006', name:'봉길동', balancd:600000, account:"특수",grade: "Normal"},
        ]

        $(function() {
            accs.forEach(function(acc, index) {
                $('table').append($(`<tr><td>${index+1}</td><td>${acc.id}</td><td>${acc.name}</td><td>${acc.balancd}</td><td>${acc.account}</td><td>${acc.grade}</td><td><button class='del'>삭제</button></td></tr>`))
            })

            $('.del').click(function() {
                $(this).closest('tr').remove();
            })
        })
    </script>


</head>
<body>
    <h1>전체계좌조회</h1>
    <table>
        <thead>
            <tr id="first"><th>순서</th><th>계좌번호</th><th>이름</th><th>입금액</th><th>종류</th><th>등급</th><th>삭제</th></tr>
        </thead>

    </table>
    
</body>
</html>
