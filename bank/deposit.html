<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            text-align: center;
            margin-top: 50px;
        }
        
        #outer {
            width: 350px;
            border: 1px solid black;
            margin: 0 auto;
            padding: 25px 0;
            
        }

        #outer>div {
            margin-bottom: 15px;
        }

        #outer>div:last-child {
            margin-bottom: 0;
        }


        h2 {
            display: inline-block;
            width: 80px;
            text-align: center;
            font-size: 20px;
            margin: 0;
            vertical-align: middle;            
        }
        input {
            width:200px;
            height:22px;
            margin-left: 10px;
            vertical-align: middle;
        }

        button {
            width: 100px;
            height: 30px;
            margin-top: 0;
            margin-left: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>입금</h1>
    <div id="outer">
        <div>
            <h2>계좌번호</h2>
            <input type="text">
        </div>
        <div>
            <h2>입금액</h2>
            <input type="text">
        </div>
        <br>
        <button>입금</button>
        
    </div>
    
</body>
</html>
