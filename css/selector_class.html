<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .select {
            color: red;
        }
        .item {
            color: gray;
        }
        .header {
            background-color: blue;
        }
    </style>
</head>
<body>
    <ul>
        <li class="select">사과</li>
        <li>바나나</li>
        <li class="select">오렌지</li>
        <li>감</li>
    </ul>


    <h1 class= "item header">동해물과 백두산이</h1>
    // h1태그에 item과 header라는 두개의 클래스를 적용했다.  클래스는 여러개를 적용할 수 있다.  클래스는 공백으로 구분한다.




</body>
</html>
