    <p>일본판과 한국판을 기준으로 '별의(星の)'가 붙은 제목이 본가 별의 커비 시리즈고, 게임 제목에 그냥 '커비'만 있는 경우 별의 커비 시리즈의 외전이다. 볼드체 글씨는 정통파 시리즈. 정발판은 정발된 제목으로 적는다. </p>
    <p>정통파 작품 기준 발매 텀이 평균적으로 2년이 걸려 대체적으로 짧은 편이다. 텀이 가장 짧았던 작품은 10개월 26일 걸린 별의 커비 꿈의 샘 이야기 이며 반대로 텀이 가장 오래걸렸던 작품은 대략 5년이나 걸렸던 별의 커비 Wii이다.</p>
