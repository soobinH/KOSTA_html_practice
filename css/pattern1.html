<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

    body{
        width:960px;
        margin: 0 auto;
        overflow: hidden;
    }

    #menu{
        width: 260px;
        float: left;
    }

    #section{
        width: 700px;
        float: right;
    }

    @media screen and (max-width: 768px){
        body{
            width: 100%;
        }
        #menu{
            width: auto;
            float: none;
        }
        #section{
            width: auto;
            float: none;
        }
    }

    </style>

</head>




<body>
    
    <div id="menu">
        <ul>
            <li>메뉴A</li>
            <li>메뉴B</li>
            <li>메뉴C</li>
        </ul>
    </div> 
    <div id="section">
        <h1>Lorem ipsum</h1>
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Distinctio temporibus beatae alias ab quo, nemo voluptas architecto illo vero! Eos.</p>
    </div>
</body>
</html>
