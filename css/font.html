<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .font_big1 {
            /* 2em : 기본 폰트 사이즈의 2배 */
            font-size: 2em;
        }
        .font_big2 {
            font-size: 32px;
        }
        .font_italic {
            font-style: italic;
        }
        .font_bold {
            font-weight: bold;
        }
        .font_center {
            text-align: center;
        }
        .font_right {
            text-align: right;
        }
    </style>
</head>
<body>
    <p class="font_big1 font_italic font_bold font_center">Lorem ipsum dolor amet</p>
    <p class="font_bold font_right font_big2">2019.07.10</p>
    <p>
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. 
        Quasi officiis mollitia magnam vel explicabo corrupti omnis. 
        Eveniet et aliquam iste, nam, recusandae quidem consequuntur eaque reprehenderit, 
        consequatur sequi eos dolor.
    </p>

</body>
</html>
