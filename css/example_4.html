<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 500px; height: 300px;
            border: 1px solid black;
            position: relative;
            overflow: hidden;
        }
        .circle {
            width: 100px; height: 100px;
            border-radius: 50%;
            position:absolute;
        }  
        #red {background-color: red; left:20px; top:20px;}
        #green {background-color: green; right:20px; top:20px;}
        #blue {background-color: blue; left:20px; bottom:20px;}
        #yellow {background-color: yellow; right:20px; bottom:20px;}

    </style>
</head>
<body>
    <h1>dummy text</h1>
    <div class="container">
        <div id ="red" class="circle"></div>
        <div id ="green" class="circle"></div>
        <div id ="blue" class="circle"></div>
        <div id ="yellow" class="circle"></div>
    </div>
    <h1>dummy text</h1>   
</body>
</html>
