<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* hover : 커서 인식 됬을 때  반응 */
        h1:hover {
            color: red;
        }
        /* active : 클릭했을 때 반응 */
        h1:active {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>반응 선택자</h1>
</body>
</html>
