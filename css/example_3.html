<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.top {
            background-color: green;
            height: 100px;
            overflow: hidden;
        }
        div.middle>left {
            background-color: yellow;
            height: 100px;
            width: 30%;
            float: left;
        }
        div.middle>right {
            background-color: blue;
            height: 100px;
            width: 70%;
            float: right;
        }
        div.bottom {
            background-color: red;
            height: 100px;
        }

    </style>
</head>

<body>
    <div id="top">lorem ipsum dolor, sit amet consectetur adipisicing elit.</div>
    <div id="middle">
        <div id="left">lorem ipsum dolor, sit amet consectetur adipisicing elit.</div>
        <div id="right">lorem ipsum dolor, sit amet consectetur adipisicing elit.</div>
    </div>
    <div id="bottom">lorem ipsum dolor, sit amet consectetur adipisicing elit. </div>
</body>
</html>
