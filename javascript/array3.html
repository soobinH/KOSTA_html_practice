<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let fruits= ['사과', '바나나', '오렌지']

        let shoppingCart = fruits;
        shoppingCart.push("수박");

        console.log(fruits.length);

        // 1. "jazz", "blues"가 있는 styles 배열 생성
        // 2. "rock n roll"을 배열의 끝에 추가
        // 3. 배열의 첫 번째 요소를 꺼내서 출력
        // 4. "Rap" 과 "Reggae"를 배열의 앞에 추가

        let styles = ['jazz', 'blues'];
        styles.push("rock-n-roll");
        console.log(styles.shift());
        styles.unshift("Rap", "Reggae");
        console.log(styles); 

        // 아래 조건을 만족하는 함수 sumInput()을 작성해 봅시다.
        // prompt 창을 띄워 사용자에게 숫자를 입력해 달라고 요청한 후, 입력받은 값들을 배열에저장합니다.
        // 숫자가 아닌 값, 혹은 빈 문자열을 입력하거나 취소 버튼을 누르면 질문을 멈춥니다.
        // 배열 요소의 합을 계산하고 리턴합니다.

        
        function sumInput() {
            let arr = [];
            let result = 0;
            while(true) {
                let input = prompt("숫자를 입력해주세요", 0);
                if(input ==="" || input===null || !isFinite(input)) break;
                arr.push(+input);
            }
            arr.forEach(num=>result+=num)

            return result;
        }
        
        

        console.log(sumInput());

    </script>
</head>

</html>
