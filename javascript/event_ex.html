    <script>
        // initial : 계산 전의 잔고
        // interest : 이자율, 0.05는 연5%의 이자율을 의미한다.
        // years : 예금 유치 기간으로, 연 단위
        // result = Math.round(initial * (1 + interest * years))
        $(function() {
          let $money = $("input[name='money']");
          let $interest = $("input[name='interest']");
          let $months = $("select[name='months']")

          let $money_before = $("#money-before");
          let $money_after = $("#money-after");

          let initial = +$money.val();
          let interest_rate= +$interest.val()/100;
          let years= $months.val()/12;

          $money.on('input', function() {
            initial = +$money.val();
            $money_before.text($money.val());
            calculate();
          })

          $interest.on('input', function() {
            interest_rate = +$interest.val()/100;
            calculate();
          })

          $months.change(function() {
            years = $months.val()/12;
            calculate();
          })

          function calculate() {

            let result = Math.round(initial * (1 + interest_rate * +years));
            $money_after.text(result);

            let height = result/initial*100;
            $("#height-after").height(height);
          }
            

          calculate();

        

        })

  <form name="calculator">
    <table>
      <tr>
        <td>예치금액</td>
        <td>
          <input name="money" type="number" value="10000" required>
        </td>
      </tr>
      <tr>
        <td>예치기간</td>
