<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // slice : 부분 배열 추출
        // arr.slice(start[,end])
        let arr = ['t', 'e', 's', 't'];
        let sub1 = arr.slice(1, 3);
        console.log(sub1); //['e', 's']
        let sub2 = arr.slice(2); //['s', 't'] -> index 2번부터 끝까지
        let sub3 = arr.slice(-2); //['s', 't'] -> 뒤에서 두 번째부터 끝까지
        
    </script>
</head>

</body>
</html>
