        }

        let str = 'Widget with id';
        console.log(str.indexOf('with'));

        console.log(str.indexOf('id'));

        let str4 = 'As sly as a fox, as strong as an ox';
        let target = 'as'
        let cnt = counter(str4, target);
        console.log(cnt);

        function counter(source, target) {
            let cnt = 0;
            let pos = -1;
            while((pos = source.indexOf(target, pos+1)) != -1) {
                cnt++;
            }

            return cnt;
            
        }

        console.log(str4.includes('fox'))
        // 부분 문자열

        console.log(str5.slice(0, 1));//s
        console.log(str5.slice(6)); //ify
        console.log(str5.slice(-4, -1)); //gif

        //str.substring(start [, end])
        console.log(str5.substring(2,6)); //ring

        console.log("a".codePointAt(0)); // a -> 97
        console.log(String.fromCodePoint(97)) // 97 -> a
