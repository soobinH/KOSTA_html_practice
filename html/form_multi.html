<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="news.html">
        <table>
            <tr>
                <td><label for="username">이름</label></td>
                <td><input type="text" id="username" name="name"></td>
            </tr>
            <tr>
                <td>성별</td>
                <td>
                    <input type="radio" id="man" name="gender" value="m">
                    <label for="man">남자</label>
                    <input type="radio" id="woman" name="gender" value="w">
                    <label for="woman">여자</label>
                </td>
            </tr>
            <tr>
                <td><label for="food">분식</label></td>
                <td>
                    <select name="food" id="food">
                        <option value="김밥">김밥</option>
                        <option value="떡볶이">떡볶이</option>
                        <option value="순대">순대</option>
                        <option value="어묵">어묵</option>
                    </select>
                </td>
            </tr>
            <tr>
                <!-- 1. 테이블 열 구조 올바르게 수정 및 label id 매칭 수정 -->
                <td><label for="mfood">분식여러개</label></td>
                <td>
                    <select name="mfood" id="mfood" multiple>
                        <option value="김밥">김밥</option>
                        <option value="떡볶이">떡볶이</option>
                        <option value="순대">순대</option>
                        <option value="어묵">어묵</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>카테고리</td>
                <td>
                    <select name="optgroup" id="optgroup">
                        <optgroup label="HTML5">
                            <option value="Multimedia Tag">Multimedia Tag</option>
                            <option value="Connectivity">Connectivity</option>
                            <option value="Device Access">Device Access</option>
                        </optgroup>
                        <!-- 2. 누락되었던 </optgroup> 및 </select> 추가 -->
                        <optgroup label="CSS3">
                            <option value="Animation">Animation</option>
                            <option value="3D Transforms">3D Transforms</option>
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="memo">메모</lable> </td>
                <td><textarea name="memo" id="memo" cols="30" rows="15">미리입력가능</textarea></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="전송">
                </td>
            </tr>



        </table>
    </form>
</body>
</html>
