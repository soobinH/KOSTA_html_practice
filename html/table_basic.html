<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th></th>
                <th>월</th>
                <th>화</th>
                <th>수</th>
                <th>목</th>
                <th>금</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1교시</td>
                <td>영어</td>
                <td>국어</td>
                <td>과학</td>
                <td>미술</td>
                <td>기술</td>
            </tr>
        </tbody>
    </table>
    <!-- table은 thead와 tbody로 구성된다  thead는 테이블의 제목 행을 정의하고, tbody는 테이블의 본문 행을 정의한다. thead는 생략이 가능하다.-->
    <!-- thead는 th 태그를 사용하는데 t는 table의 약자, h는 header의 약자이다. tbody의 td테이블의 d는 data의 약자이다. -->
    <!-- th는 볼드체로 작성된다-->
</body>
</html>
